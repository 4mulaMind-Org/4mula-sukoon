version: '3.8'
services:
  postgres:
    image: postgres:16-alpine
    container_name: sukoon-postgres
    environment:
      POSTGRES_DB: sukoon_db
      POSTGRES_USER: sukoon_user
      POSTGRES_PASSWORD: sukoon_pass
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: sukoon-redis
    ports:
      - "6379:6379"

volumes:
  pgdata: